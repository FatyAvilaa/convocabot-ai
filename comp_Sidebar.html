<style>
  /* ── Mascota animada de la barra lateral ─────────────────────── */
  .sidebar-mascota-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.85rem;
    min-height: 170px;
  }

  .mascota-brote {
    width: 190px;
    height: 190px;
    position: relative;
    animation: brotarBob 3.2s ease-in-out infinite;
  }

  .mascota-brote .halo {
    animation: brotarHalo 3.2s ease-in-out infinite;
    transform-origin: 50% 62%;
  }

  .mascota-brote .cuerpo {
    animation: brotarSway 4.4s ease-in-out infinite;
    transform-origin: 50% 78%;
  }

  .mascota-brote .ojos {
    animation: brotarParpadeo 4.6s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes brotarBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes brotarSway {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }
  @keyframes brotarHalo {
    0%, 100% { opacity: 0.35; transform: scale(0.94); }
    50%      { opacity: 0.6;  transform: scale(1.04); }
  }
  @keyframes brotarParpadeo {
    0%, 90%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.12); }
  }

  .mascota-caption {
    font-size: 0.75rem;
    color: var(--sidebar-text);
    text-align: center;
    line-height: 1.4;
    opacity: 0.85;
  }
  .mascota-caption strong { color: #fff; font-weight: 600; }

  .mascota-punto-activo {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 999px;
    background: var(--verde-hoja);
    margin-right: 0.35rem;
    box-shadow: 0 0 0 0 rgba(31,174,94,0.6);
    animation: pulsoActivo 2.2s ease-out infinite;
  }
  @keyframes pulsoActivo {
    0%   { box-shadow: 0 0 0 0 rgba(31,174,94,0.55); }
    70%  { box-shadow: 0 0 0 6px rgba(31,174,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(31,174,94,0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mascota-brote, .mascota-brote .halo, .mascota-brote .cuerpo,
    .mascota-brote .ojos, .mascota-punto-activo { animation: none; }
  }
</style>
